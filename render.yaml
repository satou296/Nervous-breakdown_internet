# Render の Blueprint（設計図）。リポジトリにこのファイルがあれば、
# Render の画面で「New → Blueprint」を選ぶだけで、下の設定のサービスが作られる。
services:
  - type: web
    name: nervous-breakdown-internet
    runtime: docker
    # 無料プラン。15分間アクセスがないと停止し、次のアクセスで約1分の起動待ちになる。
    # 外部の監視サービスで /health を10分ごとに開けば、停止させずに済む
    # （手順は docs/DEPLOY_RENDER.md の「6. いつでも開ける状態にする」）。
    # 安定運用したくなったら starter に変える（有料・常に起動）。
    plan: free
    region: singapore          # 日本から近い地域
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # main に push しても自動では反映しない。本番への反映は Render の画面の「Manual Deploy」で行う
    # （入れ替えの瞬間に進行中の部屋が消えるので、遊んでいる人がいない時間を選んで出す）
    autoDeployTrigger: "off"   # 引用符で囲む（YAML 1.1 の読み手は off を真偽値の false と読むため）
    # 部屋の情報はサーバーのメモリにあるので、台数は1台で動かす
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURN_TIMEOUT_SEC
        value: "45"
      # 独自ドメインを使う場合などに、接続を許すサイトを指定できる（カンマ区切り）
      # - key: ALLOWED_ORIGINS
      #   value: https://example.com
