# GitHub に push するたびに、自動でテストを実行する。
# 結果はリポジトリの「Actions」タブで確認できる（緑のチェック＝成功）。
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
